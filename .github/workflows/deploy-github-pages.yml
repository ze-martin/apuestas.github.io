name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/apuestas.github.io/' }}
          VITE_PROTOCOL_INDEX_URL: ${{ vars.VITE_PROTOCOL_INDEX_URL || 'https://ze-martin.github.io/' }}
          VITE_DATA_SOURCE_MODE: ${{ vars.VITE_DATA_SOURCE_MODE || 'github-pages' }}
          VITE_AUTH_PROVIDER: ${{ vars.VITE_AUTH_PROVIDER || 'none' }}
          VITE_DATABASE_PROVIDER: ${{ vars.VITE_DATABASE_PROVIDER || 'localStorage' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SETTLEMENT_API_URL: ${{ vars.VITE_SETTLEMENT_API_URL }}
          VITE_SETTLEMENT_SNAPSHOT_URL: ${{ vars.VITE_SETTLEMENT_SNAPSHOT_URL }}
        run: pnpm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
